# XcodeGen spec for macOS/Xcode: `make xcode` generates MyApp.xcodeproj (not
# committed). The app target compiles the same Sources/MyApp that xtool builds
# on Linux, with the same Info.plist and Core package.
name: MyApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
packages:
  Core:
    path: Core
targets:
  MyApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/MyApp
    dependencies:
      - package: Core
        product: MyAppCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.myapp
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: true
