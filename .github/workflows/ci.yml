name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Lint and test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/swiftly
          key: swiftly-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.swift-version') }}
      - run: scripts/bootstrap.sh --core
      - run: make lint
      - run: make test

  macos:
    name: Build app and test (macOS, Xcode)
    # GitHub ships one runner image per Xcode major; macos-26 stops at Xcode 26.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - name: Select the Xcode that matches .swift-version
        run: sudo xcode-select -s "$(scripts/sdk.sh xcode)" && xcodebuild -version
      - run: make test
      - run: make build
